display_information:
  name: Ramp90
  description: Onboarding orchestrator — welcomes, buddy intros and 30/60/90 pulse checks
  background_color: "#2a78d6"
features:
  bot_user:
    display_name: Ramp90
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
      - im:write
      - users:read
      - users:read.email
settings:
  interactivity:
    is_enabled: true
    request_url: https://ramp90.vercel.app/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
